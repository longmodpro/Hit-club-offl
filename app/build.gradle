plugins {
    id 'com.android.application'
}

android {
    namespace 'com.research.offlinewallet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.research.offlinewallet'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
